apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-values
  namespace: monitoring
data:
  values.yaml: |
    alertmanager:
      enabled: false
    pushgateway:
      enabled: false
    server:
      persistentVolume:
        enabled: false
      resources:
        requests:
          memory: 512Mi
          cpu: 250m
        limits:
          memory: 1Gi
          cpu: 500m
      service:
        type: ClusterIP
        port: 80
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      extraScrapeConfigs: |
        - job_name: 'taskmanager-backend'
          static_configs:
            - targets: ['backend-service.taskmanager.svc.cluster.local:5000']
              labels:
                app: taskmanager
                service: backend
        - job_name: 'taskmanager-frontend'
          static_configs:
            - targets: ['frontend-service.taskmanager.svc.cluster.local:80']
              labels:
                app: taskmanager
                service: frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-values
  namespace: monitoring
data:
  values.yaml: |
    persistence:
      enabled: false
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3000"
      prometheus.io/path: "/metrics"
    adminPassword: admin
    service:
      type: ClusterIP
      port: 80
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local
          access: proxy
          isDefault: true
    grafana.ini:
      server:
        root_url: "http://grafana.local"
      auth:
        disable_login_form: false
      auth.anonymous:
        enabled: false
