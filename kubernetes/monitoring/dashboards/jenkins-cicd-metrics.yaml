apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-cicd-metrics-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  jenkins-cicd-metrics.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 300 },
                  { "color": "red", "value": 600 }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "default_jenkins_builds_last_build_duration_milliseconds{jenkins_job=\"taskmanager-pipeline\"}",
              "legendFormat": "Duree build",
              "refId": "A"
            }
          ],
          "title": "Duree des builds",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 60 },
                  { "color": "red", "value": 180 }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "jenkins_job_waiting_duration{quantile=\"0.5\"}",
              "legendFormat": "Temps d attente",
              "refId": "A"
            }
          ],
          "title": "Temps d attente en file (Queue Time)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 3 },
                  { "color": "red", "value": 6 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "jenkins_queue_pending_value",
              "legendFormat": "Jobs en attente",
              "refId": "A"
            }
          ],
          "title": "Jobs en attente dans la queue",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "none" }
              },
              "mappings": [],
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Succes" },
                "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "Echecs" },
                "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }]
              }
            ]
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 8 },
          "id": 4,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "default_jenkins_builds_success_build_count_total",
              "legendFormat": "Succes",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "default_jenkins_builds_failed_build_count_total",
              "legendFormat": "Echecs",
              "refId": "B"
            }
          ],
          "title": "Taux de succes / echec des builds",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 6, "x": 12, "y": 8 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "jenkins_runs_unstable_total",
              "legendFormat": "Builds instables",
              "refId": "A"
            }
          ],
          "title": "Builds instables (Unstable)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "mappings": [],
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 6, "x": 18, "y": 8 },
          "id": 6,
          "options": {
            "displayLabels": ["percent"],
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "pieType": "donut",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "default_jenkins_executors_available",
              "legendFormat": "Disponibles",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
              "expr": "default_jenkins_executors_busy",
              "legendFormat": "Occupes",
              "refId": "B"
            }
          ],
          "title": "Executors : disponibles vs occupes",
          "type": "piechart"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["jenkins", "cicd", "taskmanager-app"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Jenkins CI/CD - taskmanager-app",
      "uid": "jenkins-cicd-metrics",
      "version": 1,
      "weekStart": ""
    }
