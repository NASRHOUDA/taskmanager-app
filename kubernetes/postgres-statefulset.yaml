apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: taskmanager
  labels:
    app: postgres
spec:
  replicas: 2
  serviceName: postgres-headless
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: postgres
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: init-replica
        image: postgres:15-alpine
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: REPLICATION_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        command:
        - bash
        - -c
        - |
          set -e
          ORDINAL="${POD_NAME##*-}"

          if [ "$ORDINAL" = "0" ]; then
            echo "[$POD_NAME] Primary node - aucune init de replica necessaire."
            exit 0
          fi

          if [ -s "$PGDATA/PG_VERSION" ]; then
            echo "[$POD_NAME] Data directory deja initialisee - on ne re-clone pas."
            exit 0
          fi

          echo "[$POD_NAME] Replica node - clonage depuis postgres-0 via pg_basebackup..."
          mkdir -p "$PGDATA"
          export PGPASSWORD="$REPLICATION_PASSWORD"

          echo "[$POD_NAME] Attente que postgres-0 soit pret..."
          until pg_isready -h postgres-0.postgres-headless -p 5432 -U replicator >/dev/null 2>&1; do
            sleep 2
          done

          pg_basebackup -h postgres-0.postgres-headless -D "$PGDATA" -U replicator -v -P --wal-method=stream

          touch "$PGDATA/standby.signal"
          echo "primary_conninfo = 'host=postgres-0.postgres-headless port=5432 user=replicator password=$REPLICATION_PASSWORD application_name=postgres-1'" >> "$PGDATA/postgresql.auto.conf"

          chmod 700 "$PGDATA"
          chown -R postgres:postgres "$PGDATA"
          echo "[$POD_NAME] Base backup termine, replica configuree."
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: taskmanager
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DB_PASSWORD
        - name: REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: REPLICATION_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -h
            - 127.0.0.1
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -h
            - 127.0.0.1
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
      storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: taskmanager
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
