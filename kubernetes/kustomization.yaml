apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: taskmanager
  namespace: flux-system
spec:
  interval: 1m
  path: ./kubernetes
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: taskmanager
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskmanager
resources:
  - configmap.yaml
  - services.yaml
  - postgres-statefulset.yaml
  - deployment-advanced.yaml
  - hpa-advanced.yaml
  - pdb-advanced.yaml
  - ingress.yaml
  - network-policies.yaml
  - externalsecret.yaml
  - secretstore.yaml
  - pvc.yaml
