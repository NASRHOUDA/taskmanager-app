title = "taskmanager-app gitleaks config"

[extend]
useDefault = true

# ===== alerting =====
[[rules]]
id = "gmail-smtp-user-literal"
description = "Adresse Gmail utilisée pour SMTP/app"
regex = '''houdanasr414@gmail\.com'''
tags = ["gmail", "email"]

[[rules]]
id = "gmail-app-password-literal"
description = "Gmail App Password connu (avec ou sans espaces)"
regex = '''ebqv[ ]?ypwd[ ]?thmm[ ]?saja'''
tags = ["gmail", "smtp", "password"]

[[rules]]
id = "gmail-app-password-pattern"
description = "Format générique d'un Gmail App Password (16 lettres, groupes de 4)"
regex = '''\b([a-z]{4}[ ]?){3}[a-z]{4}\b'''
tags = ["gmail", "smtp", "pattern"]

# ===== app =====
[[rules]]
id = "jwt-secret-literal"
description = "JWT secret connu"
regex = '''super-secret-key-change-this-to-something-secure-123456789'''
tags = ["jwt", "secret"]

[[rules]]
id = "jwt-secret-assignment"
description = "JWT secret assigné en dur dans le code"
regex = '''(?i)(jwt_secret|jwtsecret)\s*[:=]\s*['"][^'"]{10,}['"]'''
tags = ["jwt", "secret"]

[[rules]]
id = "replication-password-literal"
description = "Mot de passe de réplication PostgreSQL connu"
regex = '''BiDpwAb9oZgN4GPpcZfsN18/ONiUyMpU'''
tags = ["postgres", "replication", "password"]

# ===== db =====
[[rules]]
id = "db-password-literal"
description = "Mot de passe PostgreSQL connu"
regex = '''iyVFLrz9dgAKkwUxovqobeylOaaOc1dvkT57JhOKW4FBa1tGWoyfgXb9lq1Znp97'''
tags = ["postgres", "db", "password"]

[[rules]]
id = "postgres-connection-string"
description = "Connexion PostgreSQL avec mot de passe en clair"
regex = '''postgres(ql)?:\/\/[^:]+:[^@]{6,}@'''
tags = ["postgres", "db"]

# ===== docker =====
[[rules]]
id = "dockerhub-password-literal"
description = "Mot de passe Docker Hub connu"
regex = '''nasr\.2005'''
tags = ["docker", "password"]

[[rules]]
id = "dockerhub-username-literal"
description = "Nom d'utilisateur Docker Hub connu"
regex = '''houdanasr'''
tags = ["docker", "username"]

# ===== github =====
# ghp_ tokens déjà couverts par le ruleset par défaut de Gitleaks

# ===== google oauth =====
[[rules]]
id = "google-oauth-client-secret-literal"
description = "Google OAuth Client Secret connu"
regex = '''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'''
tags = ["google", "oauth"]

[[rules]]
id = "google-oauth-client-secret-pattern"
description = "Format générique Google OAuth Client Secret"
regex = '''GOCSPX-[A-Za-z0-9_-]{28}'''
tags = ["google", "oauth"]

[[rules]]
id = "google-oauth-client-id-literal"
description = "Google OAuth Client ID connu"
regex = '''856393744314-goma67qd6gpicl5gvglcjv3de44i6s3p\.apps\.googleusercontent\.com'''
tags = ["google", "oauth"]

[[rules]]
id = "google-oauth-client-id-pattern"
description = "Format générique Google OAuth Client ID"
regex = '''[0-9]+-[a-z0-9]{32}\.apps\.googleusercontent\.com'''
tags = ["google", "oauth"]

# ===== sonar =====
[[rules]]
id = "sonarqube-token"
description = "SonarQube Token"
regex = '''sqa_[a-f0-9]{40}'''
tags = ["sonarqube", "token"]

# ===== générique =====
[[rules]]
id = "generic-password-assignment"
description = "Mot de passe assigné en dur (variable password/passwd/pwd)"
regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*['"][^'"]{6,}['"]'''
tags = ["password", "generic"]
